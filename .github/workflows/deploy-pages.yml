name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub Pages requires a public repository on the free plan
    if: github.event.repository.private == false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
        with:
          submodules: "recursive"

      - uses: ./.github/actions/setup-deps

      # The `app` mode bypasses the login, so that the game doesn't need a server and saves in the browser
      - name: Build
        run: pnpm build:app

      - name: Prepare for GitHub Pages
        run: node scripts/prepare-pages.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # 5.0.0
        with:
          path: dist

  deploy:
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # 5.0.1
